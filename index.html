<style>
  :root{
    --bg:radial-gradient(120% 120% at 50% 0%,#122036,#070a12 70%);
    --panel:#141a2b; --line:#26324a; --accent:#37f0d0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:#dfe7f5;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  #wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px}
  #hud{display:flex;gap:16px;align-items:center;font-size:13px;letter-spacing:.5px;
    background:var(--panel);padding:8px 16px;border-radius:10px;border:1px solid var(--line);
    box-shadow:0 6px 24px rgba(0,0,0,.45);flex-wrap:wrap;justify-content:center}
  #hud b{color:var(--accent);font-weight:700}
  #hud .sep{color:#3a4a68}
  #stage{position:relative;line-height:0}
  /* real3d §7 dual-canvas: WebGL #gl under the classic overlay #c; both
     absolute inset:0, touchpad stays above (z-index 5) */
  #gl{position:absolute;inset:0;width:100%;height:100%;z-index:0}
  #gl[hidden]{display:none}
  #c{position:relative;z-index:1}
  canvas{image-rendering:pixelated;display:block;border-radius:10px;
    border:1px solid var(--line);box-shadow:0 12px 48px rgba(0,0,0,.6),0 0 0 4px #0a0e18;
    touch-action:none}
  /* touch controls (§2): stage children, never canvas listeners; fixed px so
     they overlay the scaled canvas independent of fit() */
  #touchpad{position:absolute;inset:0;pointer-events:none;z-index:5;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #touchpad>div{position:absolute;pointer-events:auto;background:var(--panel);
    border:2px solid var(--line);border-radius:14px;opacity:.55;
    touch-action:none;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent}
  #touchpad>div:active{opacity:.85;border-color:var(--accent)}
  #tpad{width:128px;height:128px;
    left:calc(12px + env(safe-area-inset-left));
    bottom:calc(12px + env(safe-area-inset-bottom))}
  #tbomb{width:72px;height:72px;border-radius:50%;
    right:calc(16px + env(safe-area-inset-right));
    bottom:calc(16px + env(safe-area-inset-bottom))}
  .btn{background:var(--panel);color:#dfe7f5;border:1px solid var(--line);
    padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit;font-size:12px;
    letter-spacing:.5px;transition:.12s}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn:active{transform:translateY(1px)}
  #controls{display:flex;gap:8px}
  .muted{opacity:.45}
  .hint{font-size:11px;color:#7385ad;max-width:560px;text-align:center;line-height:1.55}
  .hint kbd{background:#1d2740;border:1px solid #33436a;border-radius:4px;
    padding:1px 5px;color:#a9bbe0}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>
<body>
<h1 class="sr-only">Fusegrid</h1>
<div id="wrap">
  <div id="hud">
    <span>SCORE <b id="score">0</b></span><span class="sep">·</span>
    <span>LV <b id="level">1</b></span><span class="sep">·</span>
    <span>LIVES <b id="lives">3</b></span><span class="sep">·</span>
    <span>ENEMIES <b id="enemies">0</b></span><span class="sep">·</span>
    <span>BOMB <b id="bombs">1</b></span><span class="sep">·</span>
    <span>FLAME <b id="range">1</b></span>
  </div>
  <div id="stage"><canvas id="gl" hidden></canvas><canvas id="c" aria-label="Fusegrid game board"></canvas>
    <div id="touchpad" hidden>
      <div id="tpad" role="group" aria-label="Move pad"></div>
      <div id="tbomb" role="button" aria-label="Bomb"></div>
    </div>
  </div>
  <div id="controls">
    <button class="btn" id="btnPause">Pause</button>
    <button class="btn" id="btnSound">Sound: On</button>
    <button class="btn" id="btnRestart">Restart</button>
    <button class="btn" id="btnMenu">Menu</button>
    <a class="btn" href="https://github.com/HMarzban/fusegrid" target="_blank" rel="noopener noreferrer">Source</a>
  </div>
  <div class="hint">
    <kbd>WASD</kbd>/<kbd>Arrows</kbd> move · <kbd>Space</kbd> BOMB ·
    <kbd>Shift</kbd>+<kbd>Space</kbd> THROW* · <kbd>Q</kbd> REMOTE* · <kbd>K</kbd>+move KICK* ·
    <small>*needs its power-up</small>
    <kbd>P</kbd> pause
  </div>
</div>

<!-- Entry point. Single browser thread: input → sim → render.
     The authoritative sim lives in src/core/sim.js (Node-testable, no DOM).
     Single-player only; lockstep is a local harness, not internet play. -->
<script type="module">
   import {createGame} from "./src/main.js";
   import {createAudio} from "./src/audio.js";
   const canvas=document.getElementById("c");
   const audio=createAudio();
   if(/[?&]debug=1/.test(location.search||""))window.__audio=audio;
   createGame(canvas,{audio, canvasEl:canvas});
</script>
</body>
</html>
