<style>
  :root{
    --bg:radial-gradient(120% 120% at 50% 0%,#122036,#070a12 70%);
    --panel:#141a2b; --line:#26324a; --accent:#37f0d0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;width:100%;background:var(--bg);color:#dfe7f5;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  #wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px}
  #stage{position:relative;line-height:0}
  /* real3d §7 dual-canvas: WebGL #gl under the classic overlay #c; both
     absolute inset:0, touchpad stays above (z-index 5) */
  #gl{position:absolute;inset:0;width:100%;height:100%;z-index:0}
  #gl[hidden]{display:none}
  /* PIXEL: #px under #c too; its backing store is device px, owned by the px
     renderer alone (sharp-bilinear), so it opts out of pixelated scaling. */
  #px{position:absolute;inset:0;width:100%;height:100%;z-index:0;image-rendering:auto}
  #px[hidden]{display:none}
  #c{position:relative;z-index:1}
  canvas{image-rendering:pixelated;display:block;border-radius:10px;
    border:1px solid var(--line);box-shadow:0 12px 48px rgba(0,0,0,.6),0 0 0 4px #0a0e18;
    touch-action:none}
  /* touch controls (§2): stage children, never canvas listeners; fixed px,
     independent of the canvas scale. fit() (src/app/fit.js) writes
     body[data-lay] and reserves room so they never sit on the board: touch
     portrait puts pad + bomb below the stage, touch landscape moves them into
     the side gutters (the body[data-lay] rules below). */
  #touchpad{position:absolute;inset:0;pointer-events:none;z-index:5;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #touchpad>div{position:absolute;pointer-events:auto;background:var(--panel);
    border:2px solid var(--line);border-radius:14px;opacity:.55;
    touch-action:none;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent}
  #touchpad>div:active{opacity:.85;border-color:var(--accent)}
  #tpad{width:128px;height:128px;
    left:calc(12px + env(safe-area-inset-left));
    bottom:calc(12px + env(safe-area-inset-bottom))}
  #tbomb{width:72px;height:72px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    right:calc(16px + env(safe-area-inset-right));
    bottom:calc(16px + env(safe-area-inset-bottom))}
  #tbomb[hidden]{display:none}
  #tbomb canvas{width:40px;height:40px;pointer-events:none}
  /* THROW / REMOTE (touch only): shown while the player holds that power,
     one tap = one tick of the keyboard's Shift+Space / Q (Input.pulseThrow /
     pulseRemote). Fixed slots so neither moves when the other appears: THROW
     over the bomb, REMOTE beside it. Portrait slots come from actGeo
     (--ta, --tthr/--ttht, --trem/--tret); landscape sits in the right gutter. */
  #tthrow{width:52px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    right:calc(16px + env(safe-area-inset-right));bottom:calc(96px + env(safe-area-inset-bottom))}
  #tremote{width:52px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    right:calc(76px + env(safe-area-inset-right));bottom:calc(96px + env(safe-area-inset-bottom))}
  #tthrow[hidden]{display:none}
  #tremote[hidden]{display:none}
  #tthrow canvas,#tremote canvas{width:50%;height:auto;aspect-ratio:1;pointer-events:none}
  #tthrow span,#tremote span{font:900 9px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.5px;color:#dfe7f5;pointer-events:none}
  /* pause pill: 44px is the minimum comfortable target (#tbomb is 72, #tpad
     128). Two bars via ::before/::after — no canvas. Never inside the stage:
     a fixed 44px over a phone-scaled canvas lands on the right-aligned HUD
     score. Portrait keeps it above the stage (60px top pad); landscape moves
     it to the top of the right gutter, over the bomb. */
  #tpause{width:44px;height:44px;border-radius:50%;
    bottom:calc(100% + 8px);right:0}
  #tpause::before,#tpause::after{content:"";position:absolute;top:13px;
    width:4px;height:14px;background:#dfe7f5;border-radius:2px}
  #tpause::before{left:14px}
  #tpause::after{left:22px}
  /* touch portrait is width-bound: fit() writes --st (stage top, centred in
     the vertical slack; lifted under the pause pill while #touchpad shows)
     and docks + grows pad/bomb into the band below (--tp/--tb sizes,
     --tpt/--tbt offsets under the stage; portraitGeo). --sd glides the lift
     on the GAME edge only. */
  body[data-lay=p] #wrap{align-self:flex-start;padding:var(--st,60px) 8px 0;transition:padding-top var(--sd,0s) ease-out}
  body[data-lay=p] #tpad{top:calc(100% + var(--tpt,22px));bottom:auto;left:6px;width:var(--tp,128px);height:var(--tp,128px)}
  body[data-lay=p] #tbomb{top:calc(100% + var(--tbt,50px));bottom:auto;right:14px;width:var(--tb,72px);height:var(--tb,72px)}
  body[data-lay=p] #tbomb canvas{width:calc(var(--tb,72px)*5/9);height:calc(var(--tb,72px)*5/9)}
  body[data-lay=p] #tthrow{top:calc(100% + var(--ttht,8px));bottom:auto;right:var(--tthr,14px);width:var(--ta,44px);height:var(--ta,44px)}
  body[data-lay=p] #tremote{top:calc(100% + var(--tret,8px));bottom:auto;right:var(--trem,66px);width:var(--ta,44px);height:var(--ta,44px)}
  body[data-lay=l] #tpad{left:auto;right:calc(100% + 22px);bottom:0}
  body[data-lay=l] #tbomb{right:auto;left:calc(100% + 40px);bottom:10px}
  body[data-lay=l] #tthrow{right:auto;left:calc(100% + 40px);bottom:90px}
  body[data-lay=l] #tremote{right:auto;left:calc(100% + 100px);bottom:90px}
  body[data-lay=l] #tpause{right:auto;bottom:auto;left:calc(100% + 54px);top:0}
  /* NEW VERSION READY card (src/app/update.js): the CONSOLE PANEL plate as a
     DOM card. Desktop: viewport bottom-right, clear of the stage's centred
     hints. Touch portrait: the empty band under the stage on menus, above
     the stage at a run end (pad + bomb own the bottom; 60px clears the pill).
     Touch landscape: top of the left gutter. */
  #upd{position:fixed;z-index:20;right:16px;bottom:16px;display:flex;align-items:center;gap:10px;
    padding:8px 10px 8px 14px;background:rgba(10,14,24,.94);border:1px solid #2a3550;border-radius:6px;
    box-shadow:0 4px 0 rgba(0,0,0,.35),inset 3px 0 0 #37f0d0;color:#dfe7f5;
    font:700 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.12em;
    animation:updIn .16s steps(4) both;user-select:none;-webkit-user-select:none}
  #upd i{display:none}
  #upd .go{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid #37f0d0;
    border-radius:4px;background:rgba(55,240,208,.12);color:#37f0d0;font-size:12px;letter-spacing:.08em;cursor:pointer}
  #upd kbd{font:900 10px ui-monospace,monospace;padding:2px 5px;background:rgba(4,7,14,.95);border:1px solid #26324a;
    border-radius:3px;color:#dfe7f5;letter-spacing:0}
  #upd .later{font:10px ui-monospace,monospace;color:#7385ad;letter-spacing:.06em;padding:0 4px;line-height:32px;cursor:pointer}
  #upd .go:hover{background:rgba(55,240,208,.2)}#upd .later:hover{color:#dfe7f5}
  @keyframes updIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){#upd{animation:updFade .12s linear both}}
  @keyframes updFade{from{opacity:0}to{opacity:1}}
  body[data-lay=p] #upd,body[data-lay=l] #upd{left:8px;right:8px;bottom:calc(16px + env(safe-area-inset-bottom));min-height:48px;flex-wrap:wrap;row-gap:2px}
  body[data-lay=p] #upd b,body[data-lay=l] #upd b{flex:1;letter-spacing:.06em;white-space:nowrap}
  body[data-lay=p] #upd kbd,body[data-lay=l] #upd kbd{display:none}
  body[data-lay=p] #upd i{display:block;order:3;flex-basis:100%;font:400 10px ui-monospace,monospace;color:#7385ad;letter-spacing:0}
  body[data-lay=p] #upd .go,body[data-lay=l] #upd .go{height:44px;padding:0 14px}
  body[data-lay=p] #upd .later,body[data-lay=l] #upd .later{line-height:44px;padding:0 10px}
  body[data-lay=p] #upd[data-ctx=end]{bottom:auto;top:calc(12px + env(safe-area-inset-top));right:60px}
  body[data-lay=p] #upd[data-ctx=end] i{display:none}
  body[data-lay=l] #upd{right:auto;width:min(300px,30vw);bottom:auto;top:calc(8px + env(safe-area-inset-top))}
  .muted{opacity:.45}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>

<body>
<h1 class="sr-only">Fusegrid — bomb-grid arcade you play in the browser</h1>
<p class="sr-only">Single-player bomb-grid arcade. Flip REAL 3D and classic 2D. Heat CORE, PLUS, and MAX. Eight rooms. Free — no account.</p>
<noscript><p>Play Fusegrid in the browser — a single-player bomb-grid arcade. JavaScript is required.</p></noscript>
<div id="wrap">
  <div id="stage"><canvas id="gl" hidden></canvas><canvas id="px" hidden></canvas><canvas id="c" aria-label="Fusegrid game board"></canvas>
    <div id="touchpad" hidden>
      <div id="tpad" role="group" aria-label="Move pad"></div>
      <div id="tbomb" role="button" aria-label="Bomb"><canvas id="tbomb-icon" width="64" height="64" aria-hidden="true"></canvas></div>
      <div id="tthrow" role="button" aria-label="Throw" hidden><canvas width="48" height="48" aria-hidden="true"></canvas><span>THROW</span></div>
      <div id="tremote" role="button" aria-label="Remote" hidden><canvas width="48" height="48" aria-hidden="true"></canvas><span>REMOTE</span></div>
      <div id="tpause" role="button" aria-label="Pause"></div>
    </div>
  </div>
</div>

<!-- Entry point. Single browser thread: input → sim → render.
     The authoritative sim lives in src/core/sim.js (Node-testable, no DOM).
     Single-player only; lockstep is a local harness, not internet play. -->
<script type="module">
   import {createGame} from "./src/main.js";
   import {createAudio} from "./src/audio.js";
   const canvas=document.getElementById("c");
   const audio=createAudio();
   if(/[?&]debug=1/.test(location.search||""))window.__audio=audio;
   createGame(canvas,{audio, canvasEl:canvas});
</script>
