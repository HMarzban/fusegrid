  E.addEventListener("keydown",function(e){e.stopPropagation()});
  E.addEventListener("pointerdown",function(e){e.stopPropagation()});
  /* a throw while the boot job lives is a game that will never paint */
  w.addEventListener("error",function(e){if(jobs.boot&&e.filename&&e.filename.indexOf(location.origin)===0)L.fail("boot")});
  watch();paint();
})(window,document);
</script>

<!-- Entry point. Single browser thread: input → sim → render.
     The authoritative sim lives in src/core/sim.js (Node-testable, no DOM).
     Single-player only; lockstep is a local harness, not internet play. -->
<script type="module">
   /* dynamic, so a 404, a blocked file, a syntax error or a throw lands in one
      catch (a static import fails silently: a blank page). The boot job ends in
      the frame the loop first paints: frames.kick() has already queued it. */
   const L=window.__load;
   Promise.all([import("./src/main.js"),import("./src/audio.js")]).then(([{createGame},{createAudio}])=>{
     const canvas=document.getElementById("c");
     const audio=createAudio();
     if(/[?&]debug=1/.test(location.search||""))window.__audio=audio;
     createGame(canvas,{audio, canvasEl:canvas});
     requestAnimationFrame(()=>L.end("boot"));
   }).catch((e)=>{console.error(e);L.fail("boot");});
</script>
